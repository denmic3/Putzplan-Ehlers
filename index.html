<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Familien Putzplan</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a2e4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Putzplan">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Quicksand:wght@500;700;900&display=swap');

  :root {
    --teal:#1a9e8f; --navy:#1a2e4a; --coral:#ff6b6b;
    --gold:#f9c846; --green:#4caf7d; --lavender:#7c6fcd; --muted:#8899aa;
    --bg:#f5f7ff; --radius:16px; --shadow:0 4px 20px rgba(0,0,0,0.08);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Nunito',sans-serif;background:var(--bg);color:#2d3748;padding-bottom:60px;min-height:100vh;}

  .header{background:linear-gradient(135deg,var(--navy),#2a4a7a);color:white;padding:22px 20px;text-align:center;}
  .header h1{font-size:1.5rem;font-weight:900;}
  .header h1 span{color:var(--gold);}
  .header p{font-size:0.85rem;opacity:0.8;margin-top:4px;}
  .section{padding:16px;}
  .section-title{font-size:0.75rem;font-weight:900;text-transform:uppercase;letter-spacing:0.8px;color:var(--muted);margin-bottom:8px;}

  .child-picker{display:flex;flex-direction:column;gap:8px;margin-bottom:18px;}
  .child-card{display:flex;align-items:center;gap:12px;background:white;border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);cursor:pointer;border:2.5px solid transparent;}
  .child-card.selected{border-color:var(--c-color, var(--teal));background:var(--c-bg,#e6f7f5);}
  .child-avatar{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0;}
  .child-info{flex:1;}
  .child-name{font-size:0.95rem;font-weight:800;color:var(--navy);}
  .child-tag{font-size:0.73rem;color:var(--muted);font-weight:700;margin-top:1px;}
  .child-check{width:22px;height:22px;border-radius:50%;border:2.5px solid #dde2ee;flex-shrink:0;}
  .child-card.selected .child-check{background:var(--c-color,var(--teal));border-color:var(--c-color,var(--teal));position:relative;}
  .child-card.selected .child-check::after{content:'✓';position:absolute;color:white;font-size:0.7rem;left:5px;top:1px;}

  .room-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none;}
  .room-tabs::-webkit-scrollbar{display:none;}
  .room-tab{flex-shrink:0;padding:8px 16px;border-radius:99px;border:2px solid #dde2ee;background:white;font-weight:800;color:var(--muted);cursor:pointer;white-space:nowrap;font-family:inherit;font-size:0.85rem;}
  .room-tab.active{border-color:var(--teal);background:var(--teal);color:white;}

  .select-grid{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
  .select-item{background:white;border-radius:12px;padding:12px;display:flex;align-items:center;gap:11px;box-shadow:var(--shadow);cursor:pointer;border:2.5px solid transparent;}
  .select-item.selected{border-color:var(--teal);background:#e6f7f5;}
  .s-num{width:25px;height:25px;border-radius:50%;background:#eef0f5;color:var(--muted);font-size:0.8rem;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .select-item.selected .s-num{color:white;}
  .s-icon{font-size:1.3rem;}
  .s-body{flex:1;min-width:0;}
  .s-title{font-size:0.9rem;font-weight:800;color:var(--navy);}
  .s-sub{font-size:0.75rem;color:var(--muted);font-weight:600;}
  .care-alert{background:#f0ecff;color:var(--lavender);font-size:0.68rem;font-weight:800;padding:4px 9px;border-radius:99px;border:1.5px solid var(--lavender);max-width:170px;word-break:break-word;line-height:1.25;flex-shrink:0;}
  .s-check{width:20px;height:20px;border-radius:50%;border:2px solid #dde2ee;flex-shrink:0;}
  .select-item.selected .s-check{background:var(--teal);border-color:var(--teal);position:relative;}
  .select-item.selected .s-check::after{content:'✓';position:absolute;color:white;font-size:0.75rem;left:4px;top:0px;}

  .send-btn{display:block;width:100%;background:linear-gradient(135deg,#25D366,#128C7E);color:white;border:none;font-family:inherit;font-size:1rem;font-weight:900;padding:15px;border-radius:12px;cursor:pointer;text-align:center;text-decoration:none;box-shadow:0 4px 12px rgba(37,211,102,0.2);}
  .send-btn:disabled{background:#cbd5e0;box-shadow:none;cursor:not-allowed;opacity:0.6;}

  #elternAnsicht,#kinderAnsicht{display:none;}

  /* KIND-MODUS BASIS */
  .kid-header{padding:20px 20px 16px;text-align:center;color:white;position:relative;}
  .kid-header h1{font-size:1.4rem;font-weight:900;}
  .kid-header p{font-size:0.85rem;opacity:0.85;margin-top:4px;}
  .kid-progress-bg{background:rgba(255,255,255,0.25);border-radius:99px;height:10px;overflow:hidden;margin-top:14px;}
  .kid-progress-fill{height:100%;background:white;border-radius:99px;transition:width 0.4s;width:0%;}
  .kid-progress-text{font-size:0.78rem;font-weight:800;margin-top:6px;opacity:0.9;}

  /* TEEN MODE (Mia) */
  .teen-body{background:#f4f6fa;min-height:100vh;padding-bottom:40px;}
  .teen-header{background:#1a2e4a;}
  .teen-list{padding:14px 16px;display:flex;flex-direction:column;gap:8px;}
  .teen-card{background:white;border-radius:10px;padding:13px 14px;display:flex;align-items:center;gap:12px;border:1.5px solid #e2e6ef;cursor:pointer;}
  .teen-card.done{background:#f0f4f2;border-color:#cfe3d8;}
  .teen-card.done .teen-title{text-decoration:line-through;color:#9aa5b1;}
  .teen-checkbox{width:20px;height:20px;border-radius:4px;border:2px solid #c5cbd6;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:0.75rem;color:transparent;}
  .teen-card.done .teen-checkbox{background:#1a9e8f;border-color:#1a9e8f;color:white;}
  .teen-icon{font-size:1.2rem;flex-shrink:0;width:22px;text-align:center;}
  .teen-text{flex:1;min-width:0;}
  .teen-title{font-size:0.92rem;font-weight:700;color:#1a2e4a;}
  .teen-meta{font-size:0.72rem;color:#8899aa;font-weight:600;margin-top:2px;}
  .teen-steps{font-size:0.78rem;color:#6b7785;margin-top:6px;padding-left:0;list-style:none;display:none;}
  .teen-card.expanded .teen-steps{display:block;}
  .teen-steps li{padding:2px 0;}
  .teen-steps li::before{content:'– ';color:#aab4c0;}

  /* FOCUS MODE (Jano) */
  .focus-body{background:linear-gradient(180deg,#f0f9ff,#fff);min-height:100vh;padding-bottom:40px;}
  .focus-header{background:linear-gradient(135deg,#3b82f6,#6366f1);}
  .focus-list{padding:14px 16px;display:flex;flex-direction:column;gap:10px;}
  .focus-list-card{background:white;border-radius:16px;padding:14px;display:flex;align-items:flex-start;gap:12px;box-shadow:0 4px 16px rgba(59,130,246,0.10);cursor:pointer;border:2.5px solid transparent;}
  .focus-list-card.done{opacity:0.55;background:#f0f9ff;border-color:#93c5fd;}
  .focus-list-card.done .focus-list-title{text-decoration:line-through;color:#aab4c0;}
  .focus-checkbox{width:26px;height:26px;border-radius:50%;border:2.5px solid #93c5fd;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:0.9rem;color:transparent;margin-top:2px;}
  .focus-list-card.done .focus-checkbox{background:#3b82f6;border-color:#3b82f6;color:white;}
  .focus-list-icon{font-size:1.6rem;flex-shrink:0;width:30px;text-align:center;}
  .focus-list-text{flex:1;min-width:0;}
  .focus-list-title{font-size:0.95rem;font-weight:800;color:#1a2e4a;}
  .focus-list-meta{font-size:0.74rem;color:#8899aa;font-weight:700;margin-top:2px;}
  .focus-list-micro{font-size:0.83rem;color:#2563eb;font-weight:800;background:#eff6ff;padding:6px 10px;border-radius:8px;margin-top:8px;display:inline-block;}
  .focus-list-steps{font-size:0.8rem;color:#6b7785;font-weight:600;line-height:1.7;margin-top:8px;padding-left:0;list-style:none;display:none;}
  .focus-list-card.expanded .focus-list-steps{display:block;}
  .focus-list-steps li{padding-left:16px;position:relative;}
  .focus-list-steps li::before{content:'→';position:absolute;left:0;color:#3b82f6;font-weight:900;}
  .focus-care{font-size:0.75rem;color:#7c6fcd;background:#f0ecff;padding:6px 10px;border-radius:8px;margin-top:8px;font-weight:700;display:inline-block;}
  .focus-celebration{display:none;text-align:center;padding:24px 20px;background:linear-gradient(135deg,#eff6ff,#fff);margin:16px;border-radius:16px;border:2px dashed #3b82f6;}
  .focus-celebration.show{display:block;}

  /* MINI MODE (Tilda) */
  .mini-body{background:linear-gradient(180deg,#fffbe8,#fff);min-height:100vh;display:flex;flex-direction:column;font-family:'Quicksand',sans-serif;position:relative;overflow:hidden;}
  .mini-stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;position:relative;}
  .mini-scene{width:100%;max-width:300px;border-radius:28px;padding:36px 20px;margin-bottom:22px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 2px 14px rgba(0,0,0,0.05);}
  .mini-scene-icon{font-size:7rem;filter:drop-shadow(0 4px 10px rgba(0,0,0,0.12));}
  .mini-title{font-size:1.6rem;font-weight:900;color:#1a2e4a;margin-bottom:24px;}
  .mini-btn{background:linear-gradient(135deg,#f9c846,#f7b733);border:none;color:#1a2e4a;font-family:'Quicksand',sans-serif;font-size:1.3rem;font-weight:900;padding:24px 48px;border-radius:99px;box-shadow:0 8px 24px rgba(249,200,70,0.4);cursor:pointer;}
  .mini-confetti-stage{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50;}
  .confetti-piece{position:absolute;top:-40px;animation:confettiFall linear forwards;}
  @keyframes confettiFall{0%{transform:translateY(0) rotate(0deg);opacity:1;}100%{transform:translateY(110vh) rotate(360deg);opacity:0.9;}}

  /* WhatsApp Fertig-Button */
  .wa-done-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:calc(100% - 32px);margin:16px auto 24px;background:linear-gradient(135deg,#25D366,#128C7E);color:white;border:none;font-family:'Nunito',sans-serif;font-size:1rem;font-weight:900;padding:16px;border-radius:14px;cursor:pointer;box-shadow:0 4px 16px rgba(37,211,102,0.3);}
  .wa-done-btn svg{flex-shrink:0;}
</style>
</head>
<body>

<!-- ELTERN BEREICH -->
<div id="elternAnsicht">
  <div class="header">
    <h1>🏠 Putzplan <span>Familie</span></h1>
    <p>Kind auswählen, Raum & Aufgaben festlegen</p>
  </div>
  <div class="section">
    <div class="section-title">1. Für wen ist der Plan?</div>
    <div class="child-picker" id="childPicker"></div>

    <div class="section-title">2. Welcher Raum?</div>
    <div class="room-tabs" id="roomTabs"></div>

    <div class="section-title">3. Aufgaben auswählen</div>
    <div class="select-grid" id="selectGrid"></div>

    <button id="whatsappBtn" class="send-btn" onclick="sendToWhatsApp()" disabled>
      🚀 Plan via WhatsApp senden
    </button>
  </div>
</div>

<!-- KINDER BEREICH -->
<div id="kinderAnsicht"></div>

let currentChild = null;
let currentRoom  = 'bad_unten';
let selectedTasks = new Set();

/* ============================================================
   INIT / ROUTING
   ============================================================ */
function init() {
  const params = new URLSearchParams(window.location.search);
  if (params.get('mode') === 'child') {
    renderChildView(params);
  } else {
    document.getElementById('elternAnsicht').style.display = 'block';
    buildChildPicker();
    buildRoomTabs();
    buildElternGrid();
  }
}

function buildChildPicker() {
  const wrap = document.getElementById('childPicker');
  wrap.innerHTML = '';
  Object.keys(CHILDREN).forEach(key => {
    const c = CHILDREN[key];
    const el = document.createElement('div');
    el.className = 'child-card' + (currentChild === key ? ' selected' : '');
    el.style.setProperty('--c-color', c.color);
    el.style.setProperty('--c-bg', c.bg);
    el.onclick = () => { currentChild = key; buildChildPicker(); validateEltern(); };
    el.innerHTML = `
      <div class="child-avatar" style="background:${c.bg};">${c.icon}</div>
      <div class="child-info">
        <div class="child-name">${c.name}${c.age ? ` <span style="font-weight:600;color:var(--muted);">· ${c.age} J.</span>` : ''}</div>
        <div class="child-tag">${c.tag}</div>
      </div>
      <div class="child-check"></div>`;
    wrap.appendChild(el);
  });
}

function buildRoomTabs() {
  const container = document.getElementById('roomTabs');
  container.innerHTML = '';
  Object.keys(DATA).forEach(key => {
    const btn = document.createElement('button');
    btn.className = `room-tab ${key === currentRoom ? 'active' : ''}`;
    btn.innerText = `${DATA[key].icon} ${DATA[key].name}`;
    btn.onclick = () => {
      currentRoom = key;
      selectedTasks.clear();
      buildRoomTabs();
      buildElternGrid();
      validateEltern();
    };
    container.appendChild(btn);
  });
}

function buildElternGrid() {
  const grid = document.getElementById('selectGrid');
  grid.innerHTML = '';
  DATA[currentRoom].tasks.forEach(t => {
    const el = document.createElement('div');
    el.className = 'select-item' + (selectedTasks.has(t.id) ? ' selected' : '');
    el.onclick = () => {
      if (selectedTasks.has(t.id)) selectedTasks.delete(t.id);
      else selectedTasks.add(t.id);
      buildElternGrid();
      validateEltern();
    };
    let energyColor = t.energy === 'Aufwärmen' ? 'var(--green)' : (t.energy === 'Hauptteil' ? 'var(--gold)' : 'var(--coral)');
    el.innerHTML = `
      <div class="s-num" style="background:${energyColor};">★</div>
      <div class="s-icon">${t.icon}</div>
      <div class="s-body">
        <div class="s-title">${t.title}</div>
        <div class="s-sub">⏱ ${t.time} · <span style="color:${energyColor};font-weight:bold;">${t.energy}</span></div>
      </div>
      ${t.careAlert ? `<div class="care-alert">💡 ${t.careAlert}</div>` : ''}
      <div class="s-check"></div>`;
    grid.appendChild(el);
  });
}

function validateEltern() {
  document.getElementById('whatsappBtn').disabled = !(currentChild && selectedTasks.size > 0);
}

function sendToWhatsApp() {
  const c = CHILDREN[currentChild];
  const taskIds = Array.from(selectedTasks).join(',');
  const localPath = window.location.href.split('?')[0];
  const childLink = `${localPath}?mode=child&child=${currentChild}&room=${currentRoom}&tasks=${taskIds}`;
  const greetings = {
    teen:  c.name === 'Eltern' ? `Hallo! Hier ist der Plan für ${DATA[currentRoom].name}:` : `Hey ${c.name}, hier ist dein Plan für ${DATA[currentRoom].name}:`,
    focus: `Hi ${c.name}! 🌟 Dein Plan für ${DATA[currentRoom].name} wartet – öffne ihn gleich!`,
    mini:  `Kleine Helferin gesucht! 💛 Tipp auf den Link für deine Aufgabe:`
  };
  const message = `${greetings[c.mode]}\n\n🔗 ${childLink}\n\nDu schaffst das! 🏆`;
  window.location.href = `https://api.whatsapp.com/send?text=${encodeURIComponent(message)}`;
}

init();

/* ============================================================
   WHATSAPP FERTIG-MELDUNG
   ============================================================ */
function sendDoneWhatsApp(childName, roomName, doneTasks) {
  const taskList = doneTasks.map(t => `✅ ${t.title}`).join('\n');
  const msg = `Hallo! 👋\n\n*${childName}* hat alle Aufgaben im *${roomName}* erledigt! 🎉\n\nErledigt:\n${taskList}\n\n⭐ Super gemacht!`;
  window.open('https://api.whatsapp.com/send?text=' + encodeURIComponent(msg), '_blank');
}

/* ============================================================
   ROUTING KINDER
   ============================================================ */
function renderChildView(params) {
  const childKey = params.get('child');
  const roomKey  = params.get('room');
  const taskIds  = (params.get('tasks') || '').split(',').map(Number);
  const c        = CHILDREN[childKey];
  const room     = DATA[roomKey] || DATA.bad_unten;
  const tasks    = room.tasks.filter(t => taskIds.includes(t.id));

  const container = document.getElementById('kinderAnsicht');
  container.style.display = 'block';

  if (c.mode === 'teen')  renderTeenMode(container, c, room, tasks);
  if (c.mode === 'focus') renderFocusMode(container, c, room, tasks);
  if (c.mode === 'mini')  renderMiniMode(container, c, room, tasks);
}

/* ============================================================
   MODUS 1 — MIA (16): Teen-Modus, klare Struktur, volle Liste
   ============================================================ */
function renderTeenMode(container, c, room, tasks) {
  const total = tasks.length;
  container.innerHTML = `
    <div class="teen-body">
      <div class="kid-header teen-header">
        <h1>${room.icon} ${room.name}</h1>
        <p>Liste · ${total} Aufgaben</p>
        <div class="kid-progress-bg"><div class="kid-progress-fill" id="prog"></div></div>
        <div class="kid-progress-text" id="progText">0 / ${total} erledigt</div>
      </div>
      <div class="teen-list" id="teenList"></div>
    </div>`;

  const list = document.getElementById('teenList');
  tasks.forEach(t => {
    const card = document.createElement('div');
    card.className = 'teen-card';
    card.innerHTML = `
      <div class="teen-checkbox">✓</div>
      <div class="teen-icon">${t.icon}</div>
      <div class="teen-text">
        <div class="teen-title">${t.title}</div>
        <div class="teen-meta">${t.time} · ${t.energy}</div>
        <ul class="teen-steps">${t.steps.map(s => `<li>${s}</li>`).join('')}</ul>
      </div>`;
    card.querySelector('.teen-checkbox').onclick = (e) => {
      e.stopPropagation();
      card.classList.toggle('done');
      updateTeenProgress(total, tasks, c, room);
    };
    card.querySelector('.teen-text').onclick = () => card.classList.toggle('expanded');
    list.appendChild(card);
  });
}

function updateTeenProgress(total, tasks, c, room) {
  const done = document.querySelectorAll('.teen-card.done').length;
  document.getElementById('prog').style.width = (done / total * 100) + '%';
  document.getElementById('progText').textContent = `${done} / ${total} erledigt`;
  const existing = document.getElementById('waDoneBtn');
  if (done === total) {
    if (!existing) {
      const btn = document.createElement('button');
      btn.id = 'waDoneBtn';
      btn.className = 'wa-done-btn';
      btn.innerHTML = `${waIcon()} Fertig melden per WhatsApp`;
      btn.onclick = () => sendDoneWhatsApp(c.name, room.name, tasks);
      document.getElementById('teenList').after(btn);
    }
  } else if (existing) {
    existing.remove();
  }
}

/* ============================================================
   MODUS 2 — JANO (9, ADHS+ASS): Focus-Modus, Gesamtübersicht,
   warmer Ton, Mikro-Schritte, blaue Akzente
   ============================================================ */
function renderFocusMode(container, c, room, tasks) {
  const total = tasks.length;
  container.innerHTML = `
    <div class="focus-body">
      <div class="kid-header focus-header">
        <h1>${room.icon} ${room.name}</h1>
        <p>Hi ${c.name}! Du siehst alles auf einen Blick 💪</p>
        <div class="kid-progress-bg"><div class="kid-progress-fill" id="prog"></div></div>
        <div class="kid-progress-text" id="progText">0 / ${total} geschafft</div>
      </div>
      <div class="focus-list" id="focusList"></div>
      <div class="focus-celebration" id="focusCel">
        <div style="font-size:2.8rem">🎉</div>
        <div style="font-size:1.2rem;font-weight:900;color:#1a2e4a;margin-top:6px;">Alles geschafft, ${c.name}!</div>
        <p style="color:#8899aa;font-weight:600;margin-top:6px;">Mega gemacht – du hast's durchgezogen! 🌟</p>
      </div>
    </div>`;

  const list = document.getElementById('focusList');
  tasks.forEach(t => {
    const card = document.createElement('div');
    card.className = 'focus-list-card';
    card.innerHTML = `
      <div class="focus-checkbox">✓</div>
      <div class="focus-list-icon">${t.icon}</div>
      <div class="focus-list-text">
        <div class="focus-list-title">${t.title}</div>
        <div class="focus-list-meta">⏱ ${t.time}</div>
        <div class="focus-list-micro">👉 ${t.microStep}</div>
        <ul class="focus-list-steps">${t.steps.map(s => `<li>${s}</li>`).join('')}</ul>
        ${t.careAlert ? `<div class="focus-care">💡 ${t.careAlert}</div>` : ''}
      </div>`;
    card.querySelector('.focus-checkbox').onclick = (e) => {
      e.stopPropagation();
      card.classList.toggle('done');
      updateFocusProgress(total, tasks, c, room);
    };
    card.querySelector('.focus-list-text').onclick = () => card.classList.toggle('expanded');
    list.appendChild(card);
  });
}

function updateFocusProgress(total, tasks, c, room) {
  const done = document.querySelectorAll('.focus-list-card.done').length;
  document.getElementById('prog').style.width = (done / total * 100) + '%';
  document.getElementById('progText').textContent = `${done} / ${total} geschafft`;
  const cel = document.getElementById('focusCel');
  const existing = document.getElementById('waDoneBtn');
  if (done === total) {
    cel.classList.add('show');
    cel.scrollIntoView({ behavior: 'smooth', block: 'center' });
    if (!existing) {
      const btn = document.createElement('button');
      btn.id = 'waDoneBtn';
      btn.className = 'wa-done-btn';
      btn.innerHTML = `${waIcon()} Fertig melden per WhatsApp`;
      btn.onclick = () => sendDoneWhatsApp(c.name, room.name, tasks);
      cel.after(btn);
    }
  } else {
    cel.classList.remove('show');
    if (existing) existing.remove();
  }
}

/* ============================================================
   MODUS 3 — TILDA (6): Mini-Modus, großes Icon, kein langer
   Text, Piktogramme führen durch die Aufgaben
   ============================================================ */
function renderMiniMode(container, c, room, tasks) {
  let idx = 0;
  const total = tasks.length || 1;

  // Aufgaben-Szenen: je nach ID ein passendes Hintergrundgradient
  const sceneThemes = {
    100: 'linear-gradient(160deg,#fef3c7,#fde68a)',
    101: 'linear-gradient(160deg,#dbeafe,#bfdbfe)',
    102: 'linear-gradient(160deg,#ffe4e6,#fecdd3)',
    103: 'linear-gradient(160deg,#ede9fe,#ddd6fe)',
    104: 'linear-gradient(160deg,#fef9c3,#fef08a)',
    105: 'linear-gradient(160deg,#e0e7ff,#c7d2fe)',
    106: 'linear-gradient(160deg,#d1fae5,#a7f3d0)',
    107: 'linear-gradient(160deg,#cffafe,#a5f3fc)'
  };
  const defaultScene = 'linear-gradient(160deg,#fff3c4,#ffe9a8)';

  container.innerHTML = `<div class="mini-body"><div class="mini-stage" id="miniStage"></div></div>`;

  function renderStage() {
    const stage = document.getElementById('miniStage');

    if (idx >= total) {
      stage.innerHTML = `
        <div class="mini-confetti-stage" id="confettiStage"></div>
        <div class="mini-scene" style="background:linear-gradient(160deg,#fff9db,#fef3c7);">
          <div class="mini-scene-icon">🌟</div>
        </div>
        <div class="mini-title">Super, ${c.name}! 🎉</div>
        <button class="wa-done-btn" style="margin-top:8px;" id="waDoneBtn">
          ${waIcon()} Fertig melden per WhatsApp
        </button>`;
      document.getElementById('waDoneBtn').onclick = () => sendDoneWhatsApp(c.name, room.name, tasks);
      launchConfetti();
      return;
    }

    const t = tasks[idx];
    const scene = sceneThemes[t.id] || defaultScene;

    // Für Tilda: microStep als einzige Info, kein langer Titel
    stage.innerHTML = `
      <div class="mini-scene" style="background:${scene};">
        <div class="mini-scene-icon">${t.icon}</div>
      </div>
      <div class="mini-title">${t.microStep || t.title}</div>
      <button class="mini-btn" id="miniBtn">Geschafft! 🎉</button>`;

    document.getElementById('miniBtn').onclick = () => { idx++; renderStage(); };
  }

  renderStage();
}

function launchConfetti() {
  const stage = document.getElementById('confettiStage');
  if (!stage) return;
  const pieces = ['🎉','🎊','⭐','💛','🌟','✨'];
  for (let i = 0; i < 24; i++) {
    const span = document.createElement('span');
    span.className = 'confetti-piece';
    span.textContent = pieces[Math.floor(Math.random() * pieces.length)];

    stage.appendChild(span);
  }
